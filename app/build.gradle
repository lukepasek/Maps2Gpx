plugins {
    id 'com.android.application'
}

import java.util.Properties

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxAccessToken = localProperties.getProperty('mapbox.accessToken', '')

android {
    compileSdk 34

    defaultConfig {
        applicationId "pl.net.xtech.maps2gpx"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    // AGP 8 disables AIDL by default; we need it for BRouter's IBRouterService.
    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'String', 'MAPBOX_ACCESS_TOKEN',
                '"' + mapboxAccessToken.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace 'pl.net.xtech.maps2gpx'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.maplibre.gl:android-sdk:11.13.5'

    testImplementation 'junit:junit:4.13.2'
}
